{% extends 'app/base.html' %}
{% load static %}

{% block title %}Admin Login - Mahakal Telecom Mankapur{% endblock %}

{% block content %}
  <main id="main-content" class="section-padding container" style="padding-top: 140px; min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div style="width: 100%; max-width: 450px; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-lg);">
      
      <div style="text-align: center; margin-bottom: 32px;">
        <img src="{% static 'app/logo/image.png' %}" alt="Logo" style="height: 50px; margin: 0 auto 16px; border-radius: var(--radius-sm);">
        <h1 style="font-size: 1.75rem; font-family: var(--font-title); font-weight: 800;">Admin Control Panel</h1>
        <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 4px;">Sign in to manage product listings</p>
      </div>

      {% if error %}
        <div style="background-color: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger-red); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 24px; color: var(--danger-red); font-size: 0.85rem; text-align: center;">
          {{ error }}
        </div>
      {% endif %}

      <form method="post" action="{% url 'admin_login' %}" style="display: flex; flex-direction: column; gap: 20px;">
        {% csrf_token %}
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="username" style="font-size: 0.82rem; font-weight: 600; color: var(--text-secondary);">Username</label>
          <input type="text" name="username" id="username" required placeholder="Enter username" style="background-color: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 16px; outline: none; color: var(--text-primary); transition: var(--transition-fast);" class="hover-glow-gold">
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="password" style="font-size: 0.82rem; font-weight: 600; color: var(--text-secondary);">Password</label>
          <input type="password" name="password" id="password" required placeholder="Enter password" style="background-color: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 16px; outline: none; color: var(--text-primary); transition: var(--transition-fast);" class="hover-glow-gold">
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top: 10px;">Sign In</button>
      </form>
    </div>
  </main>
{% endblock %}
